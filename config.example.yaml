# rti-bridge configuration
# Copy to config/config.yaml (gitignored) or mount it at /config/config.yaml.
# MQTT_HOST / MQTT_PORT / MQTT_USER / MQTT_PASS / LOG_LEVEL env vars override this file.

mqtt:
  host: 10.0.0.103
  port: 1883
  user: home
  password: ""                 # leave blank and set MQTT_PASS in the container env, or fill in here
  base_topic: rti/ad8x         # changing this moves every state/command topic
  matrix_base_topic: rti/vhd8x # topics for the VHD-8x matrix
  discovery_prefix: homeassistant

discovery:
  # On startup, delete retained HA discovery entries that belong to these amps
  # but aren't in this file any more (renamed zones, removed amps). Logged.
  cleanup_orphans: true

logging:
  level: INFO                  # DEBUG also dumps raw telnet bytes

web:
  enabled: true
  port: 8088                   # http://<docker-host>:8088/
  password: ""                 # optional; browser asks for it (any username). Or set WEB_PASSWORD.

timing:
  poll_interval_sec: 20        # full 8-zone poll per amp
  # connect_timeout_sec: 6
  # per_cmd_timeout_sec: 5
  # post_send_settle_sec: 0.1
  # inter_cmd_sleep_sec: 0.2  # gap between telnet commands (was 0.08 before 2.1.1)
  # set_retries: 2
  # retry_sleep_sec: 0.2
  # vol_coalesce_sec: 1.2
  # vol_echo_suppress_sec: 1.0
  # health_check_interval_sec: 30
  # dump_raw_chunks: true
  # tone_settle_sec: 6           # bass/treble: send once, wait this long, verify once
  # reconnect_backoff_initial_sec: 5   # then doubles per failure...
  # reconnect_backoff_max_sec: 30      # ...up to this
  # amp_start_stagger_sec: 1.5   # offset each amp's polling

# One entry per AD-8x. Add or remove amps freely.
#
#   id       used in MQTT topics and entity IDs - don't change once set
#   name     optional device name shown in Home Assistant; safe to change anytime
#   zones    1-8. Either "Name" or {name: Name, id: some_id}.
#            The id pins the HA entity: with an id you can rename the zone freely.
#            Without one, the id is derived from the name, so a rename makes a
#            new entity (and cleanup_orphans removes the old one).
#            Unlisted zones show up as "Zone N".
#   sources  optional labels for inputs 1-8. Unlabelled inputs show as "1".."8".
amps:
  - id: amp1
    # name: Outdoor Amp        # optional HA device name (default "RTI AD-8x (amp1)")
    host: 192.168.1.133
    port: 23
    zones:
      1: { name: Saloon Patio, id: saloon_patio }
      2: { name: Master Bath,  id: master_bath }
      3: { name: Master Patio, id: master_patio }
      4: { name: Lanai,        id: lanai }
      5: { name: Barbeque,     id: barbeque }
      6: { name: Cabana,       id: cabana }
      7: { name: Garage,       id: garage }
      8: { name: M-Bath Patio, id: m_bath_patio }
    sources: {}
    # sources:
    #   1: Sonos 1
    #   2: Sonos 2

  - id: amp2
    host: 192.168.1.163
    port: 23
    zones:
      1: { name: Kitchen,     id: kitchen }
      2: { name: Living Room, id: living_room }
      3: { name: Saloon Bar,  id: saloon_bar }
      4: { name: Dining Room, id: dining_room }
      5: { name: Office,      id: office }
      6: { name: Gym,         id: gym }
      7: { name: Courtyard,   id: courtyard }
      8: { name: Stage,       id: stage }
    sources: {}

# RTI VHD-8x video matrix (Pulse-Eight inside), controlled over its HTTP API.
# Numbers are 1-based, as on the matrix's own web page.
#
#   id       used in MQTT topics and entity IDs - don't change once set
#   inputs   optional labels for inputs 1-8; unlabelled inputs use the matrix's own names
#   outputs  only listed outputs get Home Assistant entities (none listed = all 10).
#            {name, id}: the id pins the entity, so set real names BEFORE first start
#            (or edit the id in the YAML view) - renames later keep the id.
matrices:
  - id: matrix
    # name: Video Matrix
    host: 192.168.1.114
    poll_interval_sec: 5
    inputs: {}
    #   2: Dish
    #   4: Cameras
    #   6: Apple TV
    outputs:
      2: { name: Saloon TV A, id: saloon_tv_a }     # matrix reports SAMSUNG
      3: { name: Saloon TV B, id: saloon_tv_b }     # matrix reports SAMSUNG
      5: { name: Receiver A,  id: receiver_a }      # matrix reports RX V665
      6: { name: Receiver B,  id: receiver_b }      # matrix reports RX V665
